<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b9944a"><link rel="manifest" href="/manifest.json">
<title>AMLAK AI OFFICE</title>

<style>
:root{--bg:#0b0c0e;--panel:#14161a;--panel2:#1a1d22;--line:#2a2e35;--text:#f4f1ea;--muted:#9da3ad;--gold:#c5a15a;--danger:#d75b5b;--ok:#59b889}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#252016 0,#0b0c0e 32%);color:var(--text);font-family:Tahoma,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
header{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;background:#0b0c0eea;backdrop-filter:blur(14px);z-index:10}.brand{font-weight:900;letter-spacing:1px}.brand span{color:var(--gold)}
nav{display:flex;gap:6px;overflow:auto}nav button,.ghost{background:transparent;color:var(--muted);border:1px solid transparent;padding:9px 12px;border-radius:10px}nav button.active,nav button:hover{color:var(--text);border-color:var(--line);background:var(--panel)}
main{max-width:1300px;margin:auto;padding:24px}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:1.1fr .9fr}.cards{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:linear-gradient(145deg,#17191d,#101216);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 12px 35px #0003}.stat .n{font-size:30px;font-weight:900;margin-top:8px}.muted{color:var(--muted);font-size:13px}.gold{color:var(--gold)}
h1{font-size:26px;margin:8px 0 20px}h2{font-size:18px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.btn{border:0;border-radius:11px;padding:10px 15px;background:var(--gold);color:#111;font-weight:800}.btn.dark{background:var(--panel2);border:1px solid var(--line);color:var(--text)}.btn.danger{background:var(--danger);color:#fff}
input,select,textarea{width:100%;background:#0f1114;border:1px solid var(--line);color:var(--text);border-radius:11px;padding:11px;outline:none}textarea{min-height:110px;resize:vertical}label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field{margin-bottom:12px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.full{grid-column:1/-1}
.thumb{width:100%;height:150px;object-fit:cover;border-radius:12px;background:#0b0c0e}.mini{width:64px;height:48px;object-fit:cover;border-radius:8px}.property-card{padding:0;overflow:hidden}.property-card .body{padding:15px}.pill{display:inline-block;border:1px solid var(--line);padding:4px 8px;border-radius:999px;color:var(--muted);font-size:11px;margin:2px}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .card{width:min(430px,100%);padding:28px}.logo{font-size:25px;font-weight:900;margin-bottom:24px}.logo b{color:var(--gold)}
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}.media-item{position:relative}.media-item img,.media-item video{width:100%;height:100px;object-fit:cover;border-radius:10px}.media-item button{position:absolute;top:4px;left:4px;border:0;background:#000b;color:#fff;border-radius:7px;padding:3px 6px}.primary{outline:2px solid var(--gold)}
#map{height:320px;border-radius:14px;overflow:hidden;border:1px solid var(--line)}.toast{position:fixed;bottom:18px;left:18px;background:#17191d;border:1px solid var(--line);padding:12px 16px;border-radius:12px;z-index:99}
@media(max-width:800px){.stats,.two,.formgrid{grid-template-columns:1fr}header{height:auto;min-height:68px;flex-wrap:wrap;gap:8px;padding:10px}.brand{width:auto}nav{width:100%}}
/* Premium simple workspace navigation */
.nav-shell{display:flex;align-items:center;gap:7px;flex:1;justify-content:center}
.nav-direct,.nav-trigger{background:rgba(255,255,255,.48);color:var(--text);border:1px solid var(--line);padding:9px 13px;border-radius:12px;font-weight:800;font-size:12px}
.nav-direct:hover,.nav-trigger:hover,.nav-trigger.active{background:#fff;color:var(--green2);border-color:rgba(21,148,107,.22);box-shadow:0 8px 22px rgba(21,110,80,.08)}
.nav-group{position:relative}.nav-trigger{display:flex;align-items:center;gap:7px}.nav-trigger .chev{font-size:10px;opacity:.6}
.nav-menu{position:absolute;top:calc(100% + 8px);right:0;min-width:250px;padding:8px;border:1px solid rgba(20,80,61,.12);border-radius:18px;background:rgba(255,255,255,.94);box-shadow:0 22px 55px rgba(21,110,80,.16);backdrop-filter:blur(22px);z-index:30;display:none}
.nav-group:hover .nav-menu,.nav-group:focus-within .nav-menu{display:grid}
.nav-menu button{border:0;background:transparent;text-align:right;padding:11px 12px;border-radius:11px;color:var(--text);font-size:12px;font-weight:700}
.nav-menu button:hover{background:#eaf8f2;color:var(--green2)}
.nav-menu .nav-caption{padding:7px 10px 5px;color:var(--muted);font-size:10px;font-weight:800}
.workspace-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}.workspace-title{font-size:28px;font-weight:950;margin:0}.workspace-sub{color:var(--muted);font-size:13px;margin-top:6px}
.workspace-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.workspace-card{padding:20px;border:1px solid rgba(20,80,61,.11);border-radius:20px;background:rgba(255,255,255,.68);box-shadow:0 14px 38px rgba(21,110,80,.07);transition:.18s}.workspace-card:hover{transform:translateY(-2px);box-shadow:0 20px 45px rgba(21,110,80,.11)}
.workspace-icon{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:#e5f7ef;color:var(--green2);font-size:21px;margin-bottom:13px}.workspace-card h2{margin:0 0 7px;font-size:16px}.workspace-card p{margin:0;color:var(--muted);font-size:12px;line-height:1.8}.workspace-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:15px}.workspace-actions .btn{font-size:11px;padding:8px 11px}.tier-lock{display:inline-flex;margin-top:12px;padding:5px 8px;border-radius:999px;background:#fff4d8;color:#8b681c;font-size:10px;font-weight:900}
@media(max-width:900px){.nav-shell{justify-content:flex-start;overflow:auto}.workspace-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.workspace-grid{grid-template-columns:1fr}.nav-menu{position:fixed;right:10px;left:10px;top:118px;min-width:0}.nav-shell{gap:5px}.nav-direct,.nav-trigger{padding:8px 10px;font-size:11px}}
/* AMLAK AI OFFICE light glass green system */
:root{--bg:#f3faf7;--panel:rgba(255,255,255,.72);--panel2:rgba(245,252,249,.9);--line:rgba(20,80,61,.12);--text:#10251e;--muted:#6d817a;--green:#15946b;--green2:#0c7654;--danger:#d84f61;--ok:#15946b;--gold:#c49a3a}
body{background:radial-gradient(circle at 85% -10%,#d8f6e8 0,#f3faf7 35%,#edf7f3 100%);color:var(--text)}
header{border-bottom:1px solid var(--line);background:rgba(255,255,255,.68);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 8px 30px rgba(23,90,67,.06)}
.brand span,.gold{color:var(--green)}nav button.active,nav button:hover{color:var(--green2);border-color:var(--line);background:rgba(255,255,255,.7)}
.card{background:var(--panel);border:1px solid rgba(255,255,255,.85);box-shadow:0 18px 45px rgba(30,105,80,.08);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.btn{background:linear-gradient(135deg,#1aa879,#0f8c65);color:#fff;box-shadow:0 8px 20px rgba(21,148,107,.18)}.btn.dark{background:rgba(255,255,255,.7);border:1px solid var(--line);color:var(--text)}
input,select,textarea{background:rgba(255,255,255,.72);border:1px solid var(--line);color:var(--text)}input:focus,select:focus,textarea:focus{border-color:rgba(21,148,107,.45);box-shadow:0 0 0 4px rgba(21,148,107,.08)}
.login .card{background:rgba(255,255,255,.76);box-shadow:0 25px 70px rgba(21,110,80,.13)}.logo b{color:var(--green)}
.property-card:hover{transform:translateY(-3px);box-shadow:0 24px 50px rgba(21,110,80,.12)}
.service-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.service-card{padding:20px;border:1px solid var(--line);background:rgba(255,255,255,.68);border-radius:20px;box-shadow:0 15px 40px rgba(21,110,80,.06)}.svc-icon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:#e2f6ee;color:var(--green2);font-size:20px;margin-bottom:12px}.tier-pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:#e6f7f0;color:var(--green2);font-size:11px;font-weight:800}.role-banner{padding:18px;border-radius:20px;background:linear-gradient(135deg,rgba(21,148,107,.12),rgba(255,255,255,.55));border:1px solid rgba(21,148,107,.14)}
</style>
</head>
<body>
<div id="login" class="login"><div class="card"><img src="/logo.svg" alt="AMLAK AI OFFICE" style="width:min(310px,90%);display:block;margin:0 auto 24px"><div class="field"><label>ایمیل مدیر / کاربر</label><input id="email" type="email"></div><div class="field"><label>رمز عبور</label><input id="password" type="password"></div><button id="loginBtn" class="btn" type="button" style="width:100%">ورود</button><p id="loginMsg" class="muted"></p></div></div>
<div id="app" class="hidden">
<header><div class="brand"><img src="/logo.svg" alt="AMLAK AI OFFICE" style="height:42px;width:auto;display:block"></div><nav id="nav"></nav><button class="ghost" onclick="logout()">خروج</button></header>
<main id="view"></main>
</div>
<div id="toast" class="toast hidden"></div>
<script>
function loadLeaflet(){return new Promise((res,rej)=>{if(window.L)return res();const l=document.createElement('link');l.rel='stylesheet';l.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(l);const sc=document.createElement('script');sc.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';const t=setTimeout(()=>rej(new Error('timeout')),10000);sc.onload=()=>{clearTimeout(t);res()};sc.onerror=()=>{clearTimeout(t);rej(new Error('load'))};document.head.appendChild(sc)})}
const $=id=>document.getElementById(id);let me=null,types={},props=[],clientsData=[],followupsData=[],map,marker,currentProperty=null;
let lastList=null;function back(){(lastList||home)()}
function toEn(s){return String(s??'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d))}
function fmtPrice(n){n=Number(toEn(n||0));if(!n)return '—';const s=n.toLocaleString('en-US');const w=[];let b=Math.floor(n/1e9),r=n%1e9,m=Math.floor(r/1e6);r=r%1e6;const h=Math.floor(r/1e3);if(b)w.push(b+' میلیارد');if(m)w.push(m+' میلیون');if(!b&&h)w.push(h+' هزار');return s+' تومان'+(w.length?' ('+w.join(' و ')+')':'')}
function perMeter(price,area){price=Number(toEn(price||0));area=Number(toEn(area||0));if(!price||!area)return null;return Math.round(price/area)}
function updatePriceHint(){const price=rawNum('price'),area=rawNum('area');const pm=perMeter(price,area);const el=$('priceHint');if(!el)return;el.textContent=price?fmtPrice(price)+(pm?' · '+fmtPrice(pm)+' هر متر':''):''}
function liveFormat(id){const el=$(id);if(!el)return;el.addEventListener('input',()=>{const raw=toEn(el.value).replace(/[^\d]/g,'');el.dataset.raw=raw;el.value=raw?Number(raw).toLocaleString('en-US'):'';if(typeof updatePriceHint==='function')updatePriceHint()})}
function rawNum(id){const el=$(id);if(!el)return '';return el.dataset.raw!==undefined&&el.dataset.raw!==''?el.dataset.raw:toEn(el.value).replace(/[^\d]/g,'')}
async function api(url,opt={}){const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||`خطا (HTTP ${r.status})`);return d}
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2800)}
async function boot(){try{me=await api('/api/me');types=await api('/api/property-types');$('login').classList.add('hidden');$('app').classList.remove('hidden');nav();home()}catch{}}
async function login(){const btn=document.querySelector('#login .btn'),msg=$('loginMsg');try{msg.textContent='در حال ورود…';btn.disabled=true;btn.style.opacity='.65';const email=$('email').value.trim(),password=$('password').value;if(!email||!password)throw new Error('ایمیل و رمز عبور را وارد کنید');me=await api('/api/login',{method:'POST',body:JSON.stringify({email,password})});types=await api('/api/property-types');$('login').classList.add('hidden');$('app').classList.remove('hidden');nav();await home()}catch(e){msg.textContent=e.message||'ورود انجام نشد';}finally{btn.disabled=false;btn.style.opacity='1'}}

async function logout(){await api('/api/logout',{method:'POST'});location.reload()}
const TIER_RANK_UI={free:0,plus:1,pro:2,office:3,enterprise:4};
function hasTierUI(required){return (TIER_RANK_UI[String(me?.subscription_tier||'free')]||0)>=(TIER_RANK_UI[required]||0)}
function workspaceCard(icon,title,desc,actions=[],required='free'){
 const ok=hasTierUI(required)||me?.role==='admin';
 const buttons=actions.map(a=>`<button class="btn ${a.dark?'dark':''}" onclick="${a.fn}()">${a.label}</button>`).join('');
 return `<div class="workspace-card"><div class="workspace-icon">${icon}</div><h2>${title}</h2><p>${desc}</p>${!ok?`<span class="tier-lock">نیازمند ${required.toUpperCase()}</span>`:''}<div class="workspace-actions">${ok?buttons:`<button class="btn dark" onclick="services()">مشاهده سطح دسترسی</button>`}</div></div>`;
}
async function aiHub(){
 active('aiHub');
 $('view').innerHTML=`<div class="workspace-head"><div><h1 class="workspace-title">مرکز هوش مصنوعی</h1><div class="workspace-sub">همه قابلیت‌های AI از یک فضای مرتب؛ بدون شلوغی و بدون نیاز به شناخت Agentها.</div></div><span class="tier-pill">${String(me?.subscription_tier||'free').toUpperCase()}</span></div>
 <div class="workspace-grid">
 ${workspaceCard('✦','مرکز فرمان AI','یک دستور طبیعی بده؛ سیستم مأموریت را می‌سازد و Agentها را پشت صحنه هماهنگ می‌کند.',[{label:'باز کردن مرکز فرمان',fn:'officeCenter'}],'plus')}
 ${workspaceCard('⌁','مشاور و تحلیل ملک','تحلیل، مقایسه، پیشنهاد و بررسی اطلاعات ملک از مسیر واحد AI.',[{label:'رفتن به املاک',fn:'properties'}],'plus')}
 ${workspaceCard('◉','Media Studio','مدیریت عکس و ویدئو، ساخت محتوای بازاریابی و آماده‌سازی تور مجازی.',[{label:'املاک و رسانه',fn:'properties'}],'plus')}
 ${workspaceCard('◇','Design & Construction','طراحی، بازسازی، سناریوهای داخلی و تحلیل ساخت؛ در معماری سرویس پیش‌بینی شده.',[{label:'کاتالوگ سرویس‌ها',fn:'services'}],'pro')}
 ${workspaceCard('◎','Investment Intelligence','تحلیل سناریو، ریسک، بازده و مقایسه فرصت‌های سرمایه‌گذاری.',[{label:'کاتالوگ سرویس‌ها',fn:'services'}],'pro')}
 ${workspaceCard('⌕','Lead Scout & Market AI','شناسایی سرنخ و تحلیل بازار با Source Adapterهای مجاز؛ اتصال واقعی هنوز جداگانه پیکربندی می‌شود.',[{label:'مرکز فرمان',fn:'officeCenter'}],'pro')}
 </div>`;
}
async function toolsHub(){
 active('toolsHub');
 $('view').innerHTML=`<div class="workspace-head"><div><h1 class="workspace-title">مرکز ابزارها</h1><div class="workspace-sub">ابزارهای عملیاتی در یک منوی مستقل؛ هر ابزار جای مشخص خودش را دارد.</div></div></div>
 <div class="workspace-grid">
 ${workspaceCard('🏠','پرونده املاک','ثبت، ویرایش، رسانه، موقعیت، آگهی و مدیریت وضعیت ملک.',[{label:'باز کردن املاک',fn:'properties'},{label:'ثبت ملک',fn:'propertyForm'}])}
 ${workspaceCard('👥','CRM مشتریان','ثبت مشتری، نیاز، پیگیری و جریان کاری دفتر.',[{label:'مشتریان',fn:'clients'},{label:'پیگیری‌ها',fn:'followups'}])}
 ${workspaceCard('⌖','تطبیق هوشمند','تطبیق مشتری و ملک با توضیح نتیجه و معیارها.',[{label:'باز کردن تطبیق',fn:'matchView'}],'pro')}
 ${workspaceCard('▦','خدمات و سرویس‌ها','کاتالوگ واحد سرویس‌ها، سطح دسترسی و وضعیت قابلیت‌ها.',[{label:'مشاهده سرویس‌ها',fn:'services'}])}
 ${workspaceCard('◫','گزارش و کنترل','داشبورد، فعالیت‌ها و کنترل‌های مدیریتی در مسیر توسعه.',[{label:'داشبورد',fn:'home'},{label:'مدیریت',fn:'admin'}],'office')}
 ${workspaceCard('⚙','امنیت و دسترسی','حساب‌ها، اشتراک، سطح دسترسی و ممیزی؛ عملیات حساس پشت RBAC.',[{label:'مدیریت',fn:'admin'}],'office')}
 </div>`;
}
function nav(){
 const tier=String(me?.subscription_tier||'free');
 const canAI=me?.role==='admin'||['plus','pro','office','enterprise'].includes(tier);
 const canPro=me?.role==='admin'||['pro','office','enterprise'].includes(tier);
 const canOffice=me?.role==='admin'||['office','enterprise'].includes(tier);
 const item=(fn,label,lock=false)=>`<button data-nav="${fn}" onclick="${lock?'toast(\\'این قابلیت در سطح اشتراک شما فعال نیست\\')':fn+'()'}">${label}${lock?' 🔒':''}</button>`;
 $('nav').innerHTML=`
   <div class="nav-shell">
     <button class="nav-direct" data-nav="home" onclick="home()">داشبورد</button>
     <div class="nav-group"><button class="nav-trigger" data-nav="properties">🏠 املاک <span class="chev">⌄</span></button><div class="nav-menu">
       <div class="nav-caption">مدیریت ملک</div>${item('properties','پرونده املاک')}${item('propertyForm','ثبت ملک')}${item('services','خدمات ملک')}${item('matchView','تطبیق هوشمند',!canPro)}
     </div></div>
     <div class="nav-group"><button class="nav-trigger" data-nav="clients">👥 دفتر <span class="chev">⌄</span></button><div class="nav-menu">
       <div class="nav-caption">عملیات دفتر</div>${item('clients','مشتریان')}${item('followups','پیگیری‌ها')}${item('matchView','تطبیق هوشمند',!canPro)}${item('admin','مدیریت دفتر',me?.role!=='admin')}
     </div></div>
     <div class="nav-group"><button class="nav-trigger" data-nav="aiHub">✦ هوش مصنوعی <span class="chev">⌄</span></button><div class="nav-menu">
       <div class="nav-caption">AI Workspace</div>${item('aiHub','مرکز هوش مصنوعی')}${item('officeCenter','مرکز فرمان',!canAI)}${item('properties','AI روی ملک')}${item('services','کاتالوگ قابلیت‌های AI')}
     </div></div>
     <div class="nav-group"><button class="nav-trigger" data-nav="toolsHub">◈ ابزارها <span class="chev">⌄</span></button><div class="nav-menu">
       <div class="nav-caption">Tools Workspace</div>${item('toolsHub','مرکز ابزارها')}${item('properties','نقشه، رسانه و پرونده')}${item('clients','CRM')}${item('followups','پیگیری')}${item('services','سرویس‌ها')}
     </div></div>
     ${me?.role==='admin'?'<button class="nav-direct" data-nav="admin" onclick="admin()">مدیریت</button>':''}
   </div>`;
}
function active(id){document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));$('n-'+id)?.classList.add('active')}
async function home(){lastList=home;active('home');const d=await api('/api/dashboard');$('view').innerHTML=`<h1>داشبورد</h1><div class="grid stats">${[['ملک فعال',d.properties],['مشتری',d.clients],['پیگیری باز',d.openFollowups],['عقب‌افتاده',d.overdue]].map(x=>`<div class="card stat"><div class="muted">${x[0]}</div><div class="n">${x[1]}</div></div>`).join('')}</div><div class="grid two" style="margin-top:14px"><div class="card"><h2>مسیر سریع</h2><div class="toolbar"><button class="btn" onclick="propertyForm()">+ ثبت ملک</button><button class="btn dark" onclick="clientForm()">+ ثبت مشتری</button><button class="btn dark" onclick="openFollowForm()">+ پیگیری</button></div></div><div class="card"><h2>فعالیت اخیر</h2>${d.activities.map(a=>`<p class="muted">${a.user_name} · ${a.action} · ${a.details||''}</p>`).join('')||'<p class="muted">فعالیتی ثبت نشده</p>'}</div></div>`}
async function properties(){lastList=properties;active('properties');props=await api('/api/properties');$('view').innerHTML=`<div class="toolbar"><h1 style="margin-left:auto">پرونده املاک</h1><button class="btn" onclick="propertyForm()">+ ثبت ملک</button></div><div class="grid cards">${props.map(p=>{const m=p.media?.find(x=>x.is_primary)||p.media?.[0];const price=p.price||p.deposit||p.rent||0;const pm=perMeter(price,p.area);return `<div class="card property-card">${m?`<img class="thumb" src="${m.thumb_url||m.url}">`:''}<div class="body"><div class="muted">${p.property_type||p.purpose||''} · ${p.property_subtype||''}</div><h2>${p.title||p.description?.slice(0,40)||'ملک بدون عنوان'}</h2><p>${p.city||''} ${p.neighborhood||''}</p>${price?`<p class="gold">${fmtPrice(price)}${pm?' · '+fmtPrice(pm)+'/متر':''}</p>`:''}<div class="toolbar" style="margin-top:10px"><button class="btn dark" onclick="detail(${p.id})">مشاهده</button><button class="btn dark" onclick="editProperty(${p.id})">✏️ ویرایش</button><button class="btn danger" onclick="deleteProperty(${p.id})">🗑️ حذف</button></div><div class="toolbar" style="margin-top:6px"><button class="btn dark" onclick="copyAdGeneral(${p.id})">📋 متن آگهی</button><button class="btn dark" onclick="copyAdSocial(${p.id})">📸 اینستاگرام</button><button class="btn dark" onclick="copyAdDivar(${p.id})">🏷️ دیوار/شیپور</button>${me.subscription_tier!=='free'?'<button class="btn dark" onclick="openMediaStudio()">✨ AI Media Studio</button>':''}${p.media?.length?`<button class="btn dark" onclick="openTour(${p.id})">🖼️ تور مجازی</button>`:''}</div></div></div>`}).join('')||'<p class="muted">فایلی ثبت نشده است.</p>'}</div>`}
async function editProperty(id){const p=await api('/api/properties/'+id);propertyForm(p)}
async function deleteProperty(id){if(!confirm('این ملک غیرفعال شود؟'))return;try{await api('/api/properties/'+id,{method:'DELETE'});toast('ملک غیرفعال شد');properties()}catch(e){toast(e.message)}}
function propertyForm(p=null){const edit=!!p;$('view').innerHTML=`<div class="toolbar"><button class="btn dark" onclick="back()">‹ بازگشت</button><h1 style="margin:0">${edit?'ویرایش ملک':'ثبت سریع ملک'}</h1></div><div class="card"><div class="formgrid">
<div class="field"><label>کاربری *</label><select id="ptype" onchange="subtypes()"><option value="">انتخاب کنید</option>${Object.keys(types).map(k=>`<option ${p?.property_type===k?'selected':''} value="${k}">${k.replaceAll('_','/')}</option>`).join('')}</select></div>
<div class="field"><label>نوع ملک</label><select id="psub"><option value="">ابتدا کاربری</option></select></div>
<div class="field full"><label>عنوان / توضیح کوتاه</label><input id="title" value="${esc(p?.title)}"></div>
<div class="field full"><label>توضیحات ملک</label><textarea id="desc">${esc(p?.description)}</textarea></div>
<div class="field full"><label>توضیحات مالک</label><textarea id="owner_notes">${esc(p?.owner_notes)}</textarea></div>
<div class="field"><label>نوع معامله</label><select id="deal"><option value="">انتخاب</option><option>فروش</option><option>رهن</option><option>اجاره</option><option>رهن و اجاره</option><option>مشارکت</option></select></div>
<div class="field"><label>متراژ</label><input id="area" type="number" value="${p?.area||''}" oninput="updatePriceHint()"></div>
<div class="field"><label>خواب</label><input id="bedrooms" type="number" value="${p?.bedrooms||''}"></div>
<div class="field"><label>طبقه</label><input id="floor" type="number" value="${p?.floor||''}"></div>
<div class="field"><label>سال ساخت</label><input id="build_year" type="number" value="${p?.build_year||''}"></div>
<div class="field"><label>شهر</label><input id="city" value="${esc(p?.city)}"></div><div class="field"><label>محله</label><input id="neighborhood" value="${esc(p?.neighborhood)}"></div>
<div class="field"><label>قیمت (تومان)</label><input id="price" value="${p?.price?Number(p.price).toLocaleString('en-US'):''}" oninput="updatePriceHint()"><p class="muted" id="priceHint"></p></div><div class="field"><label>امکانات</label><input id="features" value="${esc(p?.features)}"></div>
<div class="field full"><label>Voice / متن آزاد</label><textarea id="voice">${esc(p?.raw_voice)}</textarea><button class="btn dark" onclick="voice()">🎙️ ضبط فارسی</button> <button class="btn dark" onclick="parseVoice()">استخراج هوشمند اطلاعات</button><p class="muted">اگر گفتارتان به‌جای فارسی با حروف انگلیسی (Finglish) نوشته شد، زبان دیکته آیفون را از تنظیمات ← کیبورد به فارسی تغییر دهید؛ این محدودیت خود آیفون است.</p></div>
<div class="field full"><label>رسانه‌ها — حداقل انتخاب همزمان ۱۰ عکس</label><input id="files" type="file" accept="image/*,video/*" multiple><div id="media" class="media">${renderMedia(p?.media||[])}</div></div>
<div class="field full"><label>موقعیت</label><div id="map"></div><p class="muted">روی نقشه نقطه را انتخاب کنید؛ مختصات دستی لازم نیست.</p></div>
</div><div class="toolbar"><button class="btn" onclick="saveProperty(${edit?p.id:'null'})">ذخیره ملک</button><button class="btn dark" onclick="properties()">انصراف</button></div></div>`;
subtypes(p?.property_subtype);setTimeout(()=>initMap(p),50);$('deal').value=p?.deal||'';if(p?.price)$('price').dataset.raw=String(p.price);liveFormat('price');updatePriceHint()}
function esc(v){return String(v||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function subtypes(sel=''){const k=$('ptype').value;const arr=types[k]||[];$('psub').innerHTML='<option value="">انتخاب</option>'+arr.map(x=>`<option ${x===sel?'selected':''}>${x}</option>`).join('')}
const AD_HOOKS=['✨ فرصتی استثنایی برای سرمایه‌گذاری و زندگی!','🏡 ملکی که در نگاه اول عاشقش می‌شوید.','📢 پیشنهاد ویژه؛ محدود و ارزشمند.','🌟 موقعیتی کمیاب در بازار امروز.'];
const AD_CLOSERS=['برای بازدید همین امروز با ما تماس بگیرید.','فرصت را از دست ندهید، تماس بگیرید.','برای اطلاعات بیشتر و هماهنگی بازدید در ارتباط باشید.','جهت مذاکره و بازدید حضوری تماس حاصل فرمایید.'];
function propAdText(p,variant=0){const price=p.price||p.deposit||p.rent||0;const hook=AD_HOOKS[variant%AD_HOOKS.length];const closer=AD_CLOSERS[variant%AD_CLOSERS.length];const bits=[];bits.push(`📐 متراژ: ${p.area||'—'} متر`);if(p.bedrooms)bits.push(`🛏 ${p.bedrooms} خوابه`);if(p.floor)bits.push(`🏢 طبقه ${p.floor}`);if(p.build_year)bits.push(`📅 ساخت ${p.build_year}`);if(p.deal)bits.push(`📋 ${p.deal}`);if(price)bits.push(`💰 ${fmtPrice(price)}`);if(p.features)bits.push(`✅ امکانات: ${p.features}`);let t=`${hook}\n\n🏠 ${p.title||p.property_subtype||'ملک'} در ${p.city||''} ${p.neighborhood||''}\n\n`+bits.join('\n');if(p.description)t+=`\n\n${p.description}`;t+=`\n\n${closer}`;if(p.map?.google_maps_url)t+=`\n🗺️ لوکیشن: ${p.map.google_maps_url}`;return t}
async function copyText(t,msg){try{await navigator.clipboard.writeText(t)}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);if(ta.select)ta.select();try{document.execCommand('copy')}catch(_){}ta.remove()}toast(msg)}
function openAdEditor(id,variant,tag){const p=(id?props.find(x=>x.id==id):null)||currentProperty;if(!p)return;const text=propAdText(p,variant)+(tag?`\n\n${tag}`:'');document.body.insertAdjacentHTML('beforeend',`<div id="adModal" style="position:fixed;inset:0;background:#000c;z-index:999;display:flex;align-items:center;justify-content:center;padding:16px"><div class="card" style="max-width:520px;width:100%"><h2>ویرایش متن آگهی</h2><textarea id="adText" style="min-height:260px">${esc(text)}</textarea><div class="toolbar" style="margin-top:10px"><button class="btn" onclick="finalizeAdCopy()">📋 کپی متن نهایی</button><button class="btn dark" onclick="regenAd(${id||'null'},${variant},'${tag||''}')">🔄 نسخه‌ی دیگر</button><button class="btn danger" onclick="closeAdEditor()">بستن</button></div></div></div>`)}
function regenAd(id,variant,tag){closeAdEditor();openAdEditor(id,(variant||0)+1,tag)}
function closeAdEditor(){const m=$('adModal');if(m)m.remove()}
async function finalizeAdCopy(){const t=$('adText').value;await copyText(t,'✅ متن نهایی کپی شد');closeAdEditor()}
function copyAdGeneral(id){openAdEditor(id,0,'')}
function copyAdSocial(id){openAdEditor(id,0,'#ملک #املاک #خرید_خانه #رهن_اجاره')}
function copyAdDivar(id){openAdEditor(id,0,'')}
let tourIdx=0,tourMedia=[];
function openTour(id){const p=(id?props.find(x=>x.id==id):null)||currentProperty;if(!p)return;tourMedia=(p.media||[]).filter(m=>m.type!=='video');if(!tourMedia.length)return toast('عکسی برای این ملک ثبت نشده');tourIdx=0;renderTour();document.body.insertAdjacentHTML('beforeend',`<div id="tourModal" style="position:fixed;inset:0;background:#000e;z-index:999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px"><img id="tourImg" style="max-width:92vw;max-height:78vh;object-fit:contain;border-radius:10px"><div class="toolbar"><button class="btn dark" onclick="tourNav(-1)">‹ قبلی</button><span id="tourCounter" class="muted"></span><button class="btn dark" onclick="tourNav(1)">بعدی ›</button><button class="btn danger" onclick="closeTour()">✕ بستن</button></div></div>`);renderTour()}
function renderTour(){const im=$('tourImg'),c=$('tourCounter');if(!im)return;im.src=tourMedia[tourIdx].url;if(c)c.textContent=(tourIdx+1)+' / '+tourMedia.length}
function tourNav(d){tourIdx=(tourIdx+d+tourMedia.length)%tourMedia.length;renderTour()}
function closeTour(){const m=$('tourModal');if(m)m.remove()}
function renderMedia(ms){return ms.map(m=>`<div class="media-item ${m.is_primary?'primary':''}"><${m.type==='video'?'video controls':'img'} src="${m.thumb_url||m.url}"></${m.type==='video'?'video':'img'}<button onclick="event.stopPropagation();mediaPrimary('${m.id}')">اصلی</button></div>`).join('')}
async function initMap(p){try{await loadLeaflet()}catch{const m=document.getElementById('map');if(m)m.innerHTML='<div class="muted" style="padding:30px">نقشه بارگذاری نشد (اتصال به سرویس نقشه برقرار نیست)</div>';return}map=L.map('map').setView([36.84,54.43],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);if(p?.lat&&p?.lng){marker=L.marker([p.lat,p.lng]).addTo(map);map.setView([p.lat,p.lng],15)}map.on('click',e=>{if(marker)marker.remove();marker=L.marker(e.latlng).addTo(map);marker.bindPopup('موقعیت انتخاب شد').openPopup()})}
async function saveProperty(id){try{const body={title:$('title').value,property_type:$('ptype').value,property_subtype:$('psub').value,description:$('desc').value,owner_notes:$('owner_notes').value,deal:$('deal').value,area:$('area').value,bedrooms:$('bedrooms').value,floor:$('floor').value,build_year:$('build_year').value,city:$('city').value,neighborhood:$('neighborhood').value,price:rawNum('price'),features:$('features').value,raw_voice:$('voice').value};let r=id?await api('/api/properties/'+id,{method:'PATCH',body:JSON.stringify(body)}):await api('/api/properties',{method:'POST',body:JSON.stringify(body)});const pid=id||r.id;const fs=[...$('files').files];if(fs.length){const fd=new FormData();fs.slice(0,20).forEach(f=>fd.append('files',f));await fetch('/api/properties/'+pid+'/media',{method:'POST',body:fd}).then(async x=>{if(!x.ok)throw new Error((await x.json()).error||'آپلود خطا')})}if(marker)await api('/api/properties/'+pid+'/map',{method:'POST',body:JSON.stringify({lat:marker.getLatLng().lat,lng:marker.getLatLng().lng})});toast('ملک ذخیره شد');properties()}catch(e){toast(e.message)}}
function voice(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return toast('مرورگر شما تشخیص گفتار را پشتیبانی نمی‌کند');const r=new R();r.lang='fa-IR';r.interimResults=false;r.onresult=e=>$('voice').value=($('voice').value+' '+e.results[0][0].transcript).trim();r.start()}
async function parseVoice(){try{const d=await api('/api/ai/property-parse',{method:'POST',body:JSON.stringify({text:$('voice').value})});for(const [k,v] of Object.entries(d.fields||{})){const el=$(k);if(el)el.value=v}if(d.fields.property_type){$('ptype').value=d.fields.property_type;subtypes(d.fields.property_subtype)}toast(d.provider==='ai'?'AI اطلاعات را استخراج کرد':'استخراج پایه انجام شد؛ موارد نامطمئن را بررسی کنید')}catch(e){toast(e.message)}}
async function mediaPrimary(id){try{await api('/api/properties/'+currentProperty.id+'/media',{method:'PATCH',body:JSON.stringify({primary_id:id})});detail(currentProperty.id)}catch(e){toast(e.message)}}
async function detail(id){currentProperty=await api('/api/properties/'+id);const p=currentProperty;active('properties');const price=p.price||p.deposit||p.rent||0;const pm=perMeter(price,p.area);$('view').innerHTML=`<div class="toolbar"><button class="btn dark" onclick="properties()">← املاک</button><h1 style="margin-left:auto">${esc(p.title||p.property_subtype||'پرونده ملک')}</h1><button class="btn dark" onclick="copyAdGeneral(${p.id})">📋 متن آگهی</button><button class="btn dark" onclick="copyAdSocial(${p.id})">📸 اینستاگرام</button><button class="btn dark" onclick="copyAdDivar(${p.id})">🏷️ دیوار/شیپور</button>${p.media?.length?`<button class="btn dark" onclick="openTour()">🖼️ تور مجازی</button>`:''}<button class="btn dark" onclick="editProperty(${p.id})">✏️ ویرایش</button><button class="btn danger" onclick="deleteProperty(${p.id})">🗑️ حذف</button></div><div class="grid two"><div class="card"><h2>خلاصه</h2><p>${esc(p.description)}</p><p class="gold">${p.city||''} ${p.neighborhood||''}</p><p>${p.area||'—'} متر · ${p.bedrooms||'—'} خواب · ${p.deal||'—'}</p>${price?`<p class="gold">${fmtPrice(price)}${pm?' · '+fmtPrice(pm)+' هر متر':''}</p>`:''}</div><div class="card"><h2>رسانه</h2><div class="media">${renderMedia(p.media||[])}</div></div></div><div class="card" style="margin-top:14px"><h2>موقعیت</h2><div id="detailmap"></div>${p.map?.google_maps_url?`<p><a class="gold" target="_blank" href="${p.map.google_maps_url}">مشاهده در Google Maps</a></p>`:''}</div><div class="card" style="margin-top:14px"><h2>تور مجازی</h2><p class="muted">${p.media?.length?'اسلایدشوی عکس‌های این ملک آماده است.':'برای این ملک هنوز عکسی ثبت نشده است.'}</p>${p.media?.length?`<button class="btn" onclick="openTour()">🖼️ شروع تور</button>`:''}</div>`;if(p.lat&&p.lng){try{await loadLeaflet()}catch{$('detailmap').innerHTML='<div class="muted" style="padding:30px">نقشه بارگذاری نشد</div>';return}const dm=L.map('detailmap').setView([p.lat,p.lng],15);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(dm);L.marker([p.lat,p.lng]).addTo(dm)}else $('detailmap').innerHTML='<div class="muted" style="padding:30px">موقعیت ثبت نشده</div>'}
async function clients(){lastList=clients;active('clients');clientsData=await api('/api/clients');$('view').innerHTML=`<div class="toolbar"><h1 style="margin-left:auto">مشتریان</h1><button class="btn" onclick="clientForm()">+ مشتری</button></div><div class="grid cards">${clientsData.map(c=>`<div class="card"><h2>${esc(c.name)}</h2><p>${esc(c.phone||'')}<br>${esc(c.city||'')} ${esc(c.neighborhood||'')}</p><p class="muted">${esc(c.purpose||'')}${c.min_budget||c.max_budget?' · بودجه: '+(c.min_budget?fmtPrice(c.min_budget):'—')+' تا '+(c.max_budget?fmtPrice(c.max_budget):'—'):''}</p><div class="toolbar" style="margin-top:10px"><button class="btn dark" onclick="matchForClient(${c.id})">🔍 تطبیق</button><button class="btn dark" onclick="editClient(${c.id})">✏️ ویرایش</button><button class="btn danger" onclick="deleteClient(${c.id})">🗑️ حذف</button></div></div>`).join('')||'<p class="muted">مشتری ثبت نشده است.</p>'}</div>`}
async function editClient(id){const c=clientsData.find(x=>x.id==id);clientForm(c)}
async function deleteClient(id){if(!confirm('این مشتری حذف شود؟'))return;try{await api('/api/clients/'+id,{method:'DELETE'});toast('مشتری حذف شد');clients()}catch(e){toast(e.message)}}
async function matchForClient(id){matchView();setTimeout(()=>{$('mc').value=id;runClientMatch()},80)}
function clientForm(c=null){const edit=!!c;$('view').innerHTML=`<div class="toolbar"><button class="btn dark" onclick="back()">‹ بازگشت</button><h1 style="margin:0">${edit?'ویرایش مشتری':'ثبت مشتری'}</h1></div><div class="card"><div class="formgrid"><div class="field"><label>نام</label><input id="cn" value="${esc(c?.name)}"></div><div class="field"><label>تلفن</label><input id="cp" value="${esc(c?.phone)}"></div><div class="field"><label>شهر</label><input id="cc" value="${esc(c?.city)}"></div><div class="field"><label>محله</label><input id="cnb" value="${esc(c?.neighborhood)}"></div><div class="field"><label>هدف مشتری</label><select id="ct"><option value="">انتخاب کنید</option><option ${c?.purpose==='خرید'?'selected':''}>خرید</option><option ${c?.purpose==='رهن و اجاره'?'selected':''}>رهن و اجاره</option><option ${c?.purpose==='سرمایه‌گذاری'?'selected':''}>سرمایه‌گذاری</option><option ${c?.purpose==='مشارکت در ساخت'?'selected':''}>مشارکت در ساخت</option><option ${c?.purpose==='سایر'?'selected':''}>سایر</option></select></div><div class="field"><label>بودجه حداقل (تومان)</label><input id="cb1" value="${c?.min_budget?Number(c.min_budget).toLocaleString('en-US'):''}" oninput="liveFormatInline(this)"></div><div class="field"><label>بودجه حداکثر (تومان)</label><input id="cb2" value="${c?.max_budget?Number(c.max_budget).toLocaleString('en-US'):''}" oninput="liveFormatInline(this)"></div><div class="field"><label>متراژ موردنظر (کمینه)</label><input id="ca1" type="number" value="${c?.min_area||''}"></div><div class="field"><label>متراژ موردنظر (بیشینه)</label><input id="ca2" type="number" value="${c?.max_area||''}"></div><div class="field full"><label>نیازهای ضروری / یادداشت</label><input id="cm" value="${esc(c?.must_have)}"></div></div><button class="btn" onclick="saveClient(${edit?c.id:'null'})">ذخیره</button></div>`}
function liveFormatInline(el){const raw=toEn(el.value).replace(/[^\d]/g,'');el.dataset.raw=raw;el.value=raw?Number(raw).toLocaleString('en-US'):''}
async function saveClient(id){const body={name:$('cn').value,phone:$('cp').value,city:$('cc').value,neighborhood:$('cnb').value,purpose:$('ct').value,min_budget:$('cb1').dataset.raw||toEn($('cb1').value).replace(/[^\d]/g,''),max_budget:$('cb2').dataset.raw||toEn($('cb2').value).replace(/[^\d]/g,''),min_area:$('ca1').value,max_area:$('ca2').value,must_have:$('cm').value};try{if(id)await api('/api/clients/'+id,{method:'PATCH',body:JSON.stringify(body)});else await api('/api/clients',{method:'POST',body:JSON.stringify(body)});toast('مشتری ذخیره شد');clients()}catch(e){toast(e.message)}}
async function followups(){lastList=followups;active('followups');followupsData=await api('/api/followups');$('view').innerHTML=`<div class="toolbar"><h1 style="margin-left:auto">پیگیری‌ها</h1><button class="btn" onclick="openFollowForm()">+ پیگیری</button></div><div class="grid cards">${followupsData.map(f=>`<div class="card"><h2>${esc(f.title||'پیگیری')} ${f.type?`<span class="pill">${esc(f.type)}</span>`:''}</h2><p>${f.client_name||''} ${f.property_title?' · '+f.property_title:''}</p><p class="muted">${(f.due_at||'').replace('T',' ')||'بدون موعد'} · ${f.status==='done'?'✅ انجام‌شده':'⏳ باز'}</p>${f.notes?`<p class="muted">نتیجه: ${esc(f.notes)}</p>`:''}<div class="toolbar" style="margin-top:10px">${f.status!=='done'?`<button class="btn dark" onclick="completeFollow(${f.id})">✅ تکمیل</button>`:''}<button class="btn dark" onclick="editFollow(${f.id})">✏️ ویرایش</button><button class="btn danger" onclick="deleteFollow(${f.id})">🗑️ حذف</button></div></div>`).join('')||'<p class="muted">پیگیری ثبت نشده است.</p>'}</div>`}
async function openFollowForm(f=null){if(!clientsData.length)clientsData=await api('/api/clients');if(!props.length)props=await api('/api/properties');followupForm(f)}
async function completeFollow(id){const notes=prompt('نتیجه پیگیری (اختیاری):')||'';try{await api('/api/followups/'+id,{method:'PATCH',body:JSON.stringify({status:'done',notes})});toast('پیگیری تکمیل شد');followups()}catch(e){toast(e.message)}}
async function editFollow(id){const f=followupsData.find(x=>x.id==id);openFollowForm(f)}
async function deleteFollow(id){if(!confirm('این پیگیری حذف شود؟'))return;try{await api('/api/followups/'+id,{method:'DELETE'});toast('حذف شد');followups()}catch(e){toast(e.message)}}
function followupForm(f=null){const edit=!!f;$('view').innerHTML=`<div class="toolbar"><button class="btn dark" onclick="back()">‹ بازگشت</button><h1 style="margin:0">${edit?'ویرایش پیگیری':'پیگیری جدید'}</h1></div><div class="card"><div class="formgrid"><div class="field"><label>عنوان</label><input id="ft" value="${esc(f?.title)}"></div><div class="field"><label>نوع</label><select id="fty"><option value="">انتخاب</option>${['تماس','جلسه','بازدید','پیام','سایر'].map(t=>`<option ${f?.type===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>موعد</label><input id="fd" type="datetime-local" value="${f?.due_at?f.due_at.slice(0,16):''}"></div><div class="field"><label>مشتری مرتبط</label><select id="fc"><option value="">—</option>${clientsData.map(c=>`<option ${f?.client_id==c.id?'selected':''} value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>ملک مرتبط</label><select id="fp"><option value="">—</option>${props.map(p=>`<option ${f?.property_id==p.id?'selected':''} value="${p.id}">${esc(p.title||p.property_subtype||'ملک #'+p.id)}</option>`).join('')}</select></div><div class="field full"><label>یادداشت</label><textarea id="fn">${esc(f?.notes)}</textarea></div></div><button class="btn" onclick="saveFollow(${edit?f.id:'null'})">ذخیره</button></div>`}
async function saveFollow(id){const body={title:$('ft').value,type:$('fty').value,due_at:$('fd').value,client_id:$('fc').value||null,property_id:$('fp').value||null,notes:$('fn').value};try{if(id)await api('/api/followups/'+id,{method:'PATCH',body:JSON.stringify(body)});else await api('/api/followups',{method:'POST',body:JSON.stringify(body)});toast('پیگیری ذخیره شد');followups()}catch(e){toast(e.message)}}
async function admin(){lastList=admin;active('admin');const staff=await api('/api/staff');window.__staff=staff;const acts=await api('/api/activities');$('view').innerHTML=`<h1>مدیریت دفتر</h1><div class="grid two"><div class="card"><h2>پرسنل</h2>${staff.map(s=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)"><span>${esc(s.name)} <small class="muted">${s.role}${s.active?'':' · در انتظار تأیید'}</small></span><div class="toolbar" style="margin:0"><button class="btn dark" onclick="staffReport(${s.id})">📊 گزارش</button><button class="btn ${s.active?'danger':''}" onclick="toggleStaff(${s.id},${!s.active})">${s.active?'غیرفعال کردن':'✅ تأیید و فعال‌سازی'}</button></div></div>`).join('')||'<p class="muted">پرسنلی ثبت نشده.</p>'}</div><div class="card"><h2>Backup</h2><button class="btn" onclick="location='/api/backup'">دریافت پشتیبان JSON</button><p class="muted">قبل از migration و restore نسخه پشتیبان سروری نیز ثبت می‌شود.</p></div></div><div class="card" style="margin-top:14px"><h2>گزارش عملکرد</h2><div id="reportBox"><p class="muted">از لیست پرسنل، روی «گزارش» بزنید.</p></div></div><div class="card" style="margin-top:14px"><h2>لاگ فعالیت‌ها</h2><div style="max-height:340px;overflow:auto">${acts.map(a=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)"><span class="muted">${(a.created_at||'').replace('T',' ').slice(0,16)}</span> · <b>${esc(a.user_name)}</b> · ${esc(a.action)} · ${esc(a.entity)} <span class="muted">${esc(a.details||'')}</span></div>`).join('')||'<p class="muted">فعالیتی ثبت نشده.</p>'}</div></div><div class="card" style="margin-top:14px"><h2>اشتراک و دسترسی AI</h2><p class="muted">مرکز فرمان و مأموریت‌های AI فقط برای Pro و بالاتر فعال است.</p>${staff.map(s=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)"><span>${esc(s.name)} <small class="muted">#${s.id}</small></span><div class="toolbar" style="margin:0"><select id="tier-${s.id}"><option value="free" ${s.subscription_tier==='free'?'selected':''}>Free</option><option value="plus" ${s.subscription_tier==='plus'?'selected':''}>Plus</option><option value="pro" ${s.subscription_tier==='pro'?'selected':''}>Pro</option><option value="office" ${s.subscription_tier==='office'?'selected':''}>Office</option><option value="enterprise" ${s.subscription_tier==='enterprise'?'selected':''}>Enterprise</option></select><button class="btn dark" onclick="setTier(${s.id})">ذخیره</button></div></div>`).join('')}</div>`}
async function setTier(id){try{const tier=$('tier-'+id).value;await api('/api/subscription',{method:'PATCH',body:JSON.stringify({user_id:id,tier})});toast('سطح دسترسی ذخیره شد');}catch(e){toast(e.message)}}
async function toggleStaff(id,active){try{await api('/api/staff/'+id,{method:'PATCH',body:JSON.stringify({active})});toast(active?'فعال شد':'غیرفعال شد');admin()}catch(e){toast(e.message)}}
const REPORT_LABELS={new_properties:'فایل جدید',new_clients:'مشتری جدید',followups_created:'پیگیری ثبت‌شده',followups_completed:'پیگیری انجام‌شده',followups_overdue:'عقب‌افتاده',followups_with_result:'با نتیجه ثبت‌شده',calls:'📞 تماس',meetings:'🤝 جلسه',visits:'🚶 بازدید',messages:'💬 پیام',activity_count:'کل فعالیت'};
async function staffReport(id){try{const r=await api('/api/reports/staff/'+id);const name=(window.__staff||[]).find(s=>s.id==id)?.name||r.user;$('reportBox').innerHTML=`<p class="gold">${esc(name)} — ${r.from.slice(0,10)} تا ${r.to.slice(0,10)}</p><div class="grid stats">${Object.entries(r.metrics).map(([k,v])=>`<div class="card stat"><div class="muted">${REPORT_LABELS[k]||k}</div><div class="n">${v}</div></div>`).join('')}</div><p style="margin-top:12px"><a class="gold" href="/api/reports/staff/${id}/html" target="_blank">مشاهده / چاپ گزارش کامل</a></p>`;$('reportBox').scrollIntoView({behavior:'smooth'})}catch(e){toast(e.message)}}
async function matchView(){lastList=matchView;active('matchView');if(!clientsData.length)clientsData=await api('/api/clients');if(!props.length)props=await api('/api/properties');$('view').innerHTML=`<h1>تطبیق هوشمند</h1><div class="card"><div class="toolbar"><select id="mc" style="flex:1"><option value="">مشتری را انتخاب کنید (خرید، اجاره، سرمایه‌گذاری، مشارکت و ...)</option>${clientsData.map(c=>`<option value="${c.id}">${esc(c.name)} — ${esc(c.purpose||'')}</option>`).join('')}</select><button class="btn" onclick="runClientMatch()">یافتن بهترین املاک</button></div><p class="muted">این تطبیق بر اساس نوع معامله، شهر/محله، متراژ، بودجه و امکانات محاسبه می‌شود؛ برای مشتری سرمایه‌گذار هم یکسان کار می‌کند.</p></div><div class="card" style="margin-top:14px"><div class="toolbar"><select id="mp" style="flex:1"><option value="">یا برعکس: یک ملک را انتخاب کنید</option>${props.map(p=>`<option value="${p.id}">${esc(p.title||p.property_subtype||'ملک #'+p.id)}</option>`).join('')}</select><button class="btn dark" onclick="runPropertyMatch()">یافتن بهترین مشتری‌ها</button></div></div><div id="matchResults" style="margin-top:14px"></div>`}
async function runClientMatch(){const id=$('mc').value;if(!id)return toast('یک مشتری انتخاب کنید');try{const r=await api('/api/match/'+id);renderMatch(r,'p')}catch(e){toast(e.message)}}
async function runPropertyMatch(){const id=$('mp').value;if(!id)return toast('یک ملک انتخاب کنید');try{const r=await api('/api/property-matches/'+id);renderMatch(r,'c')}catch(e){toast(e.message)}}
function renderMatch(list,kind){$('matchResults').innerHTML=`<div class="grid cards">${list.map(x=>{const price=x.price||x.deposit||x.rent;const label=kind==='p'?(x.title||x.property_subtype||'ملک #'+x.id):x.name;const sub=kind==='p'?(x.city||'')+' '+(x.neighborhood||''):(x.purpose||'')+(x.phone?' · '+x.phone:'');return `<div class="card"><div class="toolbar"><h2 style="margin:0">${esc(label)}</h2><span class="pill gold" style="margin-right:auto">امتیاز تطابق ${x.score}%</span></div><p class="muted">${esc(sub)}</p>${price?`<p class="gold">${fmtPrice(price)}</p>`:''}${x.why?.length?`<p class="muted">دلایل تطابق: ${x.why.join('، ')}</p>`:''}${kind==='p'?`<button class="btn dark" onclick="detail(${x.id})">مشاهده ملک</button>`:''}</div>`}).join('')||'<p class="muted">نتیجه‌ای پیدا نشد.</p>'}</div>`}
boot();
async function services(){
  lastList=services;active('services');
  try{
    const a=await api('/api/account'),plans=await api('/api/plans');
    const labels={consumer:'خریدار / مصرف‌کننده',agent:'مشاور املاک',office:'دفتر / مجموعه',developer:'سازنده / دولوپر',investor:'سرمایه‌گذار',owner:'مالک',tenant:'مستأجر'};
    const icons=['⌂','⌕','✦','◇','▦','◎','◌','▣'];
    $('view').innerHTML=\`<div class="toolbar"><h1 style="margin-left:auto">خدمات AMLAK AI OFFICE</h1><span class="tier-pill">\${esc(a.tier||'free').toUpperCase()}</span></div>
    <div class="role-banner"><h2 style="margin:0 0 8px">فضای کاری شما</h2><p class="muted">\${esc(labels[a.account_type]||'کاربر')}</p>
    <div class="toolbar"><select id="accountType" style="max-width:280px"><option value="consumer">خریدار / مصرف‌کننده</option><option value="agent">مشاور املاک</option><option value="office">دفتر / مجموعه</option><option value="developer">سازنده / دولوپر</option><option value="investor">سرمایه‌گذار</option><option value="owner">مالک</option><option value="tenant">مستأجر</option></select><button class="btn" onclick="saveAccountType()">ذخیره</button></div></div>
    <h2 style="margin-top:24px">پکیج‌ها</h2><div class="service-grid">\${plans.map(p=>\`<div class="service-card"><div class="svc-icon">✦</div><h2>\${esc(p.name)}</h2><p class="muted">\${p.features.join(' · ')}</p><span class="tier-pill">سطح \${p.rank}</span></div>\`).join('')}</div>
    <h2 style="margin-top:24px">خدمات فعال شما</h2><div class="service-grid">\${(a.services||[]).map((s,i)=>\`<div class="service-card"><div class="svc-icon">\${icons[i%icons.length]}</div><h2>\${esc(s.title)}</h2><span class="tier-pill">\${esc(s.tier)}</span><p class="muted">\${esc(s.group)}</p><div>\${(s.actions||[]).slice(0,6).map(x=>\`<span class="pill">\${esc(x)}</span>\`).join('')}</div></div>\`).join('')}</div>\`;
    $('accountType').value=a.account_type||'consumer';
  }catch(e){toast(e.message)}
}
async function saveAccountType(){try{await api('/api/account',{method:'PATCH',body:JSON.stringify({account_type:$('accountType').value})});me.account_type=$('accountType').value;toast('نقش کاری ذخیره شد');services()}catch(e){toast(e.message)}}
async function openMediaStudio(){
  if(!currentProperty)return toast('ابتدا یک ملک را باز کنید');
  const p=currentProperty;
  document.body.insertAdjacentHTML('beforeend',\`<div id="mediaStudio" style="position:fixed;inset:0;background:rgba(8,30,22,.45);backdrop-filter:blur(10px);z-index:1000;display:grid;place-items:center;padding:18px"><div class="card" style="max-width:760px;width:100%;max-height:90vh;overflow:auto"><div class="toolbar"><h2 style="margin-left:auto">AI Media Studio</h2><button class="btn dark" onclick="closeMediaStudio()">✕</button></div><p class="muted">برای عکس و فیلم: چیدمان خودکار، تور مجازی و سناریوی طراحی.</p><div class="formgrid"><div class="field"><label>خروجی</label><select id="msType"><option value="tour">تور مجازی</option><option value="layout">چیدمان هوشمند رسانه</option><option value="design">طراحی واقع‌گرایانه</option></select></div><div class="field"><label>موسیقی / حس</label><input id="msMusic" placeholder="مثلاً آرام و لوکس"></div><div class="field"><label>سبک</label><select id="msStyle"><option>مدرن</option><option>مینیمال</option><option>نئوکلاسیک</option><option>لوکس</option><option>اسکاندیناوی</option></select></div><div class="field"><label>کف</label><input id="msFloor" placeholder="مثلاً چوب بلوط روشن"></div><div class="field"><label>کابینت</label><input id="msCabinet" placeholder="مثلاً سفید مات + چوب"></div><div class="field"><label>دیوار / کاغذ</label><input id="msWall" placeholder="مثلاً کرم گرم"></div><div class="field full"><label>دستور AI</label><textarea id="msPrompt" placeholder="مثلاً این فضای خام را به آشپزخانه مدرن با نور طبیعی تبدیل کن..."></textarea></div></div><div class="toolbar"><button class="btn" onclick="runMediaStudio(\${p.id})">اجرای AI</button><button class="btn dark" onclick="closeMediaStudio()">انصراف</button></div><p class="muted">رندر طراحی با برچسب «تصویرسازی AI» نمایش داده می‌شود.</p></div></div>\`);
}
function closeMediaStudio(){const x=$('mediaStudio');if(x)x.remove()}
async function runMediaStudio(pid){
  try{
    const type=$('msType').value;let d;
    if(type==='tour')d=await api('/api/media-studio/properties/'+pid+'/tours',{method:'POST',body:JSON.stringify({music:$('msMusic').value,transition:'smooth',captions:true,brand:true})});
    else if(type==='layout')d=await api('/api/media-studio/properties/'+pid+'/auto-layout',{method:'POST',body:JSON.stringify({order:'ai',primary:'ai',room_labels:true})});
    else d=await api('/api/media-studio/properties/'+pid+'/design-scenarios',{method:'POST',body:JSON.stringify({style:$('msStyle').value,wall_color:$('msWall').value,floor:$('msFloor').value,cabinet:$('msCabinet').value,prompt:$('msPrompt').value})});
    toast('درخواست AI ثبت شد');closeMediaStudio();
  }catch(e){toast(e.message)}
}
</script>
